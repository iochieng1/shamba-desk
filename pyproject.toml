[project]
name = "shamba-desk"
version = "0.1.0"
description = "An agent that drafts sourced, officer-approved farm advisories for an extension office"
readme = "README.md"
authors = [
    { name = "iochieng1", email = "ochieng1044@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp[cli]>=1.30.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
shamba-desk = "shamba_desk.cli:main"
shamba-desk-mcp = "shamba_desk.server:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["network: needs internet (npx and Open-Meteo)"]
